version: '3.8'

services:
  facesentinel-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facesentinel-integration-client
    restart: unless-stopped
    ports:
      - "${PORT:-3005}:${PORT:-3005}"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
